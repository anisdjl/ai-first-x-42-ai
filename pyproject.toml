[project]
name = "ai-first-x-42-ai"
version = "0.1.0"
description = "Backend Assistant RH Local pour Atelier Nova - Conforme RGPD et IA Act"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pymongo>=4.19.0",
    "pypdf>=7.0.0",
    "pytest>=9.2.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]



[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"




worker_processes 1;
pid /tmp/nginx_atelier_nova.pid;
error_log /tmp/nginx_atelier_nova_error.log;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    
    access_log /tmp/nginx_atelier_nova_access.log;
    client_body_temp_path /tmp/nginx_client_temp;
    proxy_temp_path /tmp/nginx_proxy_temp;
    fastcgi_temp_path /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path /tmp/nginx_uwsgi_temp;
    scgi_temp_path /tmp/nginx_scgi_temp;

    # Serveur HTTP (port 8080) -> Redirection automatique vers HTTPS
    server {
        listen 8080;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    # Serveur HTTPS sécurisé avec certificat TLS (port 8443)
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /Users/anis/ai-first-x-42-ai/certs/cert.pem;
        ssl_certificate_key /Users/anis/ai-first-x-42-ai/certs/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # En-têtes de sécurité renforcés
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 180s;
            proxy_connect_timeout 180s;
        }
    }
}
